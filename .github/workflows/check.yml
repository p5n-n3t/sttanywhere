name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check shell syntax
        run: |
          bash -n bin/sttanywhere
          bash -n install.sh
      - name: Run unit tests
        run: python3 -m unittest discover -s tests
      - name: Check browser companion
        run: |
          node --check browser/background.js
          node --check browser/content.js
          node --test browser/tests/*.test.js
      - name: Verify guided installer in a real terminal
        run: python3 tests/integration_installer.py
