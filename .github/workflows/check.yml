name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check shell syntax
        run: |
          bash -n bin/sttanywhere
          bash -n install.sh
      - name: Run unit tests
        run: python3 -m unittest discover -s tests
